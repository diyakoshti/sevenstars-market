services:
  - type: web
    name: sevenstars-market
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn sevenstars.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: sevenstars-db
          property: connectionString
databases:
  - name: sevenstars-db
    databaseName: sevenstars
    user: sevenstars
