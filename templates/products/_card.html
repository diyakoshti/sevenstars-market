<article class="product-card">
    <a class="product-image" href="{{ product.get_absolute_url }}">
        <img src="{{ product.image.url }}" alt="{{ product.name }}">
        <span class="premium-label">Premium</span>
    </a>
    <div class="product-card-body">
        <span class="category">{{ product.category.name }}</span>
        <a href="{{ product.get_absolute_url }}"><h3>{{ product.name }}</h3></a>
        <div class="card-bottom"><strong>₹{{ product.price }}</strong><span>★★★★★</span></div>
    </div>
    {% if user.is_authenticated %}<a class="heart" href="{% url 'wishlist:toggle' product.id %}" aria-label="Toggle wishlist">♥</a>{% endif %}
</article>
