{% extends "base.html" %}
{% block title %}Login · SevenStars Market{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-card"><span class="eyebrow">WELCOME BACK</span><h1>Sign in to your universe</h1><p>Continue your premium shopping journey.</p>
<form method="post" class="styled-form">{% csrf_token %}{{ form.as_p }}<button class="button primary full">Login</button></form>
<p class="form-foot">New here? <a href="{% url 'accounts:register' %}">Create an account</a></p></div></section>
{% endblock %}
