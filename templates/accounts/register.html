{% extends "base.html" %}
{% block title %}Join · SevenStars Market{% endblock %}
{% block content %}
<section class="auth-shell"><div class="auth-card wide"><span class="eyebrow">JOIN THE CONSTELLATION</span><h1>Create your account</h1>

{% endblock %}
